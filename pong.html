<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong - MiniSteam</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<div class="topbar"><a href="index.html" class="btn small ghost">← Volver</a>
<span id="playerBadge" class="badge"></span>
<button id="soundBtn" class="icon-btn">🔊</button></div>
<div class="game-wrap">
<div class="game-main"><h2 style="color:#fff">🏓 Pong</h2>
<div class="controls"><label class="badge">Modo <select id="mode"><option value="cpu">Vs CPU</option><option value="2p">2 jugadores</option></select></label></div>
<div class="score"><span id="s1">0</span> : <span id="s2">0</span> (gana con 5)</div>
<canvas id="cv" width="700" height="420"></canvas>
<div class="controls"><button id="restart" class="btn small">Reiniciar</button></div></div>
<aside class="game-side"><h3>Controles</h3><ul><li>1P: W / S</li><li>2P: ↑ / ↓</li><li>Vs CPU: mouse o ↑/↓</li></ul></aside>
</div>
<script src="js/sounds.js"></script><script src="js/auth.js"></script><script src="js/pong.js"></script>
</body></html>
