<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gato - MiniSteam</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<div class="topbar"><a href="index.html" class="btn small ghost">← Volver</a>
<span id="playerBadge" class="badge"></span>
<button id="soundBtn" class="icon-btn">🔊</button></div>
<div class="game-wrap">
<div class="game-main"><h2 style="color:#fff">⭕ Gato</h2>
<div class="controls">
<label class="badge">Modo <select id="mode"><option value="pvp">2 jugadores</option><option value="cpu">Vs CPU</option></select></label>
</div>
<div class="score" id="status">Turno: X</div>
<div id="board"></div>
<div class="score">X: <span id="sx">0</span> · O: <span id="so">0</span> · Empates: <span id="se">0</span></div>
<div class="controls"><button id="restart" class="btn small">Reiniciar</button></div></div>
<aside class="game-side"><h3>Cómo jugar</h3><p>Elige modo PvP local o contra CPU. Gana con 3 en línea.</p></aside>
</div>
<script src="js/sounds.js"></script><script src="js/auth.js"></script><script src="js/gato.js"></script>
</body></html>
